<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD App - Appwrite + Express</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <div class="header-left">
          <h1>📝 CRUD Application</h1>
          <p class="subtitle">Powered by Express.js & Appwrite Database</p>
        </div>
        <div class="stat-badge">
          <span class="stat-label">รายการทั้งหมด</span>
          <span class="stat-value" id="totalItems">0</span>
        </div>
      </header>

      <!-- Main Content: 2 Columns -->
      <div class="main-content">
        <!-- Left Panel: Form -->
        <div class="left-panel">
          <div class="card">
            <h2 class="form-title" id="formTitle">เพิ่มข้อมูล</h2>

            <div id="editMode" style="display: none">
              <strong>โหมดแก้ไข</strong>
            </div>

            <form id="itemForm">
              <div class="form-group">
                <label for="itemName">
                  ชื่อสินค้า (Item Name)
                  <span class="required">*</span>
                </label>
                <input
                  type="text"
                  id="itemName"
                  required
                  placeholder="กรอกชื่อสินค้า..."
                  maxlength="255"
                />
              </div>

              <div class="form-group">
                <label for="description"> รายละเอียด (Description) </label>
                <textarea
                  id="description"
                  placeholder="กรอกรายละเอียดสินค้า..."
                  maxlength="10000"
                ></textarea>
              </div>

              <div class="form-group">
                <label for="price">
                  ราคา (Price)
                  <span class="required">*</span>
                </label>
                <input
                  type="number"
                  id="price"
                  required
                  placeholder="0.00"
                  step="0.01"
                  min="0"
                />
              </div>

              <div class="form-group">
                <label for="stockQuantity"> จำนวนสต็อก (Stock Quantity) </label>
                <input
                  type="number"
                  id="stockQuantity"
                  placeholder="0"
                  min="0"
                />
              </div>

              <div class="form-group">
                <label for="categoryId"> หมวดหมู่ (Category ID) </label>
                <input
                  type="number"
                  id="categoryId"
                  placeholder="เช่น 1, 2, 3..."
                  min="0"
                />
              </div>

              <div class="form-group">
                <label
                  style="
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    cursor: pointer;
                  "
                >
                  <input
                    type="checkbox"
                    id="isAvailable"
                    checked
                    style="width: auto"
                  />
                  <span>มีสินค้าพร้อมขาย (Available)</span>
                </label>
              </div>

              <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="submitBtn">
                  ➕ เพิ่มข้อมูล
                </button>
                <button
                  type="button"
                  class="btn btn-secondary"
                  id="cancelBtn"
                  style="display: none"
                >
                  ❌ ยกเลิก
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- Right Panel: Items List -->
        <div class="right-panel">
          <div class="card scrollable">
            <h2 class="form-title">📋 รายการข้อมูลทั้งหมด</h2>
            <div id="itemsList" class="items-list">
              <div class="loading">
                <div class="spinner"></div>
                <span>กำลังโหลดข้อมูล...</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
